name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Entra federated credentials cannot wildcard tag names, so the OIDC subject
    # is bound to this environment instead of the tag that triggered the run.
    environment: release
    # id-token: write is required for Azure OIDC (workload identity) sign-in.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: TypeBuffer-linux
          - os: windows-latest
            asset_name: TypeBuffer-windows
          - os: macos-latest
            asset_name: TypeBuffer-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Stamp version from tag
        shell: bash
        run: |
          RAW="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW#v}"
          printf '"""Generated at build time from the git tag."""\n\n__version__ = "%s"\n' "$VERSION" > version.py
          cat version.py

      - name: Build with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --add-data "assets:assets" --name TypeBuffer TypeBuffer.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --add-data "assets;assets" --icon "assets/icon.ico" --name TypeBuffer TypeBuffer.py

      # Sign the portable executable BEFORE it gets embedded into the installer,
      # so both the portable file and the installed copy carry a valid signature.
      - name: Azure login (OIDC)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign portable TypeBuffer.exe
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\TypeBuffer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build Windows Installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          if ($rawTag -match '^v?(.+)$') { $ver = $matches[1] } else { $ver = "1.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer.iss

      - name: Sign installer TypeBuffer-Setup.exe
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\installer\TypeBuffer-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare Artifacts for Upload
        shell: bash
        run: |
          mkdir -p dist/upload
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/TypeBuffer.exe dist/upload/TypeBuffer-windows.exe
            cp dist/installer/TypeBuffer-Setup.exe dist/upload/TypeBuffer-Setup.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp dist/TypeBuffer dist/upload/TypeBuffer-macos
          else
            cp dist/TypeBuffer dist/upload/TypeBuffer-linux
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/upload/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          # Flatten artifacts from subdirectories
          find artifacts -type f -exec mv {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
